[pytest]
# Where the tests live and how they are named
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Lets tests import app modules (bill_calculator, validation) from the project root
pythonpath = .

# Every "pytest" run automatically produces:
#   - verbose per-test results in the terminal
#   - coverage % in the terminal (with missing line numbers)
#   - HTML coverage report      -> reports/coverage_html/index.html
#   - JSON coverage (dashboard) -> reports/coverage.json
#   - HTML test report          -> reports/test_report.html
#   - JUnit XML (machine-readable) -> reports/junit_results.xml
#   - Run history (dashboard)   -> reports/test_history.json (written by tests/conftest.py)
addopts =
    -v
    --cov=bill_calculator
    --cov=validation
    --cov=report_reader
    --cov-report=term-missing
    --cov-report=html:reports/coverage_html
    --cov-report=json:reports/coverage.json
    --html=reports/test_report.html
    --self-contained-html
    --junitxml=reports/junit_results.xml

# Custom markers: run one category with e.g.  pytest -m boundary
markers =
    positive: positive testing with valid inputs
    negative: negative testing and exception handling
    boundary: boundary value analysis
    equivalence: equivalence partitioning
    validation: unit tests of validation functions
    frontend: Streamlit UI integration tests
    taxes: fuel surcharge and electricity duty calculation
    regression: regression testing against a frozen baseline
    integration: integration of validation + calculation modules
    reports: testing-dashboard report reader
